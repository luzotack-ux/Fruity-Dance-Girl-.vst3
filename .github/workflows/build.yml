name: Build VST3

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artefact_path: build/FruityDanceGirl_artefacts/Release/VST3
          - os: macos-latest
            name: macOS
            artefact_path: build/FruityDanceGirl_artefacts/Release/VST3
          - os: ubuntu-22.04
            name: Linux
            artefact_path: build/FruityDanceGirl_artefacts/Release/VST3

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jack2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.0-dev libglu1-mesa-dev mesa-common-dev \
            libgtk-3-dev

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target FruityDanceGirl_VST3 --parallel

      - name: Upload VST3 artefact
        uses: actions/upload-artifact@v4
        with:
          name: FruityDanceGirl-${{ matrix.name }}-VST3
          path: ${{ matrix.artefact_path }}
          if-no-files-found: error
